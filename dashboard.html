<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shiftable · Your site</title><link rel="icon" href="assets/img/favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#03040A;--card:#0d1018;--line:#1c2130;--tx:#eef1f7;--mut:#8a93a8;--mint:#7CFFC0;--or:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,sans-serif}
body.ed{overflow:hidden}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 90px}
h1{font-size:22px;margin:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 5px}
input,textarea,select{width:100%;background:#070910;color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit}
textarea{min-height:90px;resize:vertical}input:focus,textarea:focus{outline:1px solid var(--mint)}
button{background:var(--mint);color:#03130b;border:0;border-radius:9px;padding:10px 16px;cursor:pointer;font:inherit;font-weight:600}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}button:disabled{opacity:.4;cursor:default}
.f{margin-bottom:16px}.sec{color:var(--mint);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:22px 0 10px}
.pill{font-size:12px;color:var(--mut)}.msg{margin:10px 0;color:#ffb4b4;font-size:13px}.ok{color:var(--mint)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#070910ee;border-top:1px solid var(--line);padding:12px 16px;display:none}
.bar>div{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.thumb{width:100%;max-height:160px;object-fit:cover;border-radius:9px;margin-bottom:8px;background:#070910}
/* edit mode */
.eb{position:fixed;top:0;left:0;right:0;height:52px;background:var(--or);color:#1a1100;display:flex;align-items:center;gap:12px;padding:0 12px;z-index:50;font-weight:600;font-size:14px}
.eb span.t{flex:1;line-height:1.25}
.hb{background:rgba(0,0,0,.14);border:0;width:38px;height:38px;border-radius:9px;padding:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;flex:none}
.hb i{display:block;width:20px;height:2.5px;background:#1a1100;border-radius:2px}
.eb .pb{background:#1a1100;color:#fff;flex:none}
.pn{position:fixed;top:52px;left:0;width:min(460px,100vw);max-height:calc(100vh - 52px);overflow:auto;background:var(--bg);border:1px solid var(--line);border-top:0;border-radius:0 0 16px 0;padding:16px;z-index:49;display:none;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.pn .card{margin-bottom:12px}.pn .sec{margin-top:6px}
#fr{position:fixed;top:52px;left:0;width:100%;height:calc(100% - 52px);border:0;background:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#101420;border:1px solid var(--line);color:var(--tx);padding:11px 18px;border-radius:999px;z-index:60;display:none;max-width:90vw;font-size:14px}
.toast.ok{border-color:var(--mint)}.toast.err{border-color:#ff7a7a}
@media(max-width:560px){.eb{font-size:12px}}
</style></head><body><div class="wrap" id="app"></div>
<div class="bar" id="bar"><div><span class="pill" id="barTxt"></span><button id="pub">Publish changes</button></div></div>
<script>
var URL_="https://obuudbrlurybwcvuungr.supabase.co", KEY="sb_publishable_uyqV26xV1aLF_HjhIdCYcA_fUgo0KkY";
var FORM="https://formspree.io/f/xoejqzvz";
var app=document.getElementById("app"), bar=document.getElementById("bar");
if(!URL_){app.innerHTML='<div class="card">Dashboard not connected yet.</div>';throw 0}
var sb=supabase.createClient(URL_,KEY), site=null, rows=[], dirty={}, isAdmin=false, mode="", edOrigin="", me="";
var ERR={monthly_limit_reached:"You have used this month's change. It resets on the 1st, or upgrade for unlimited.",nothing_changed:"Nothing was different, so no change was used.",not_allowed:"You do not have access to this site."};
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function setMode(m){mode=m;document.body.className=m==="ed"?"ed":"";app.className=m==="ed"?"":"wrap";if(m!=="list")bar.style.display="none";window.onmessage=m==="ed"?onMsg:null}
function toast(t,k){var e=$("ts");if(!e)return;e.textContent=t;e.className="toast "+(k||"");e.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(function(){e.style.display="none"},4200)}
function errText(r){var m=(r.error&&r.error.message)||"";for(var k in ERR)if(m.indexOf(k)>-1)return ERR[k];return "Could not publish. Try again."}

function login(msg){setMode("login");app.innerHTML='<div class="card" style="max-width:380px;margin:12vh auto"><h1>Log in</h1><p class="pill">Edit your website text and photos.</p><div class="f"><label>Email</label><input id="em" type="email" autocomplete="username"></div><div class="f"><label>Password</label><input id="pw" type="password" autocomplete="current-password"></div><button id="go" style="width:100%">Log in</button><div class="msg">'+esc(msg||"")+'</div></div>';
 var go=function(){sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value}).then(function(r){r.error?login("Wrong email or password."):boot()})};
 $("go").onclick=go;pw.onkeydown=function(e){if(e.key==="Enter")go()}}
function boot(){sb.auth.getSession().then(function(r){if(!r.data.session)return login();me=r.data.session.user.email||"";
 sb.from("admins").select("user_id").then(function(a){isAdmin=!!(a.data&&a.data.length);list()})})}
function list(){sb.rpc("my_sites").then(function(s){var l=s.data||[];window._l=l;
 if(!l.length&&!isAdmin){setMode("list");app.innerHTML='<div class="card">No site is linked to this login yet. Email Jack.</div><button class="ghost" onclick="out()">Log out</button>';return}
 if(l.length===1&&!isAdmin)return open(l[0]);
 setMode("list");
 var h='<div class="top"><h1>'+(isAdmin?'All websites':'Your sites')+'</h1><div>'+(isAdmin?'<button class="ghost" onclick="location.href=\'/leads.html\'">Lead finder</button> ':'')+'<button class="ghost" onclick="out()">Log out</button></div></div>'+
  l.map(function(x,i){return'<div class="card"><b>'+esc(x.name)+'</b> <span class="pill">'+esc(x.slug)+' · '+(x.plan==="monthly"?"$250/mo":"$50/mo")+'</span> <button style="float:right" onclick="pick('+i+')">Edit</button></div>'}).join("");
 if(isAdmin)h+='<div class="sec">Add a website</div><div class="card"><div class="f"><label>Business name</label><input id="nn" placeholder="The Program Builder"></div><div class="f"><label>Short id (letters and dashes, goes in the site code)</label><input id="ns" placeholder="program-builder"></div><div class="f"><label>Plan</label><select id="np"><option value="website">$50/mo (1 change a month)</option><option value="monthly">$250/mo (unlimited)</option></select></div><button onclick="addSite()">Add website</button><div class="msg" id="am"></div></div>';
 app.innerHTML=h})}
function addSite(){var n=nn.value.trim(),sl=ns.value.trim().toLowerCase().replace(/[^a-z0-9-]/g,"-");if(!n||!sl)return am.textContent="Enter a name and an id.";
 sb.from("sites").insert({name:n,slug:sl,plan:np.value}).then(function(r){if(r.error)return am.textContent=r.error.code==="23505"?"That id is taken.":"Could not add it.";list()})}
function pick(i){open(window._l[i])}
function out(){sb.auth.signOut().then(function(){site=null;login()})}
function back(){if(Object.keys(dirty).length&&!confirm("You have edits that are not published. Leave anyway?"))return;site=null;dirty={};list()}
function open(s){site=s;dirty={};sb.from("content").select("*").eq("site_id",s.id).order("sort").then(function(r){rows=r.data||[];s.url?editor():draw()})}
function left(){return site.lim==null?"Unlimited":Math.max(0,site.lim-site.used)+" of "+site.lim+" left this month"}

/* ---------- visual editor: the real website, click to edit ---------- */
function editor(){var u;try{u=new URL(site.url)}catch(e){return draw("The site address is not valid. Fix it below.")}
 edOrigin=u.origin;setMode("ed");
 var src=site.url+(site.url.indexOf("?")>-1?"&":"?")+"shiftable-edit=1";
 app.innerHTML='<div class="eb"><button class="hb" id="hb" aria-label="Menu"><i></i><i></i><i></i></button><span class="t">This is edit mode. Changes you make will go live to your website</span><button class="pb" id="pbtn" disabled>Publish</button></div><div class="pn" id="pn"></div><iframe id="fr" src="'+esc(src)+'" title="Your website"></iframe><div class="toast" id="ts"></div>';
 $("hb").onclick=function(){var p=$("pn");p.style.display=p.style.display==="block"?"none":"block"};
 $("pbtn").onclick=function(){publish($("pbtn"))};
 $("fr").onload=function(){try{$("fr").contentWindow.postMessage({type:"sh-hello"},edOrigin)}catch(e){}};
 panel();updEd()}
function panel(){var h='<div class="card"><b>'+esc(site.name)+'</b><div class="pill">Changes: '+left()+'</div></div>';
 h+='<div class="card"><div class="sec">Message Jack</div><div class="f"><label>What do you need?</label><textarea id="fm"></textarea></div><div class="f"><label>Your email</label><input id="fe" type="email" value="'+esc(me)+'"></div><div class="f"><label>Phone number</label><input id="fp" type="tel"></div><button onclick="sendMsg(this)">Send</button><div class="msg" id="fn"></div></div>';
 h+='<div class="card" style="display:flex;gap:8px;flex-wrap:wrap">'+(isAdmin?'<button class="ghost" onclick="back()">All sites</button><button class="ghost" onclick="draw()">Edit as list</button>':'')+'<button class="ghost" onclick="out()">Log out</button></div>';
 if(isAdmin)h+=manage();
 $("pn").innerHTML=h}
function sendMsg(b){var m=$("fm").value.trim(),n=$("fn");if(!m){n.className="msg";n.textContent="Write a message first.";return}
 b.disabled=true;fetch(FORM,{method:"POST",headers:{Accept:"application/json","Content-Type":"application/json"},body:JSON.stringify({_subject:"Dashboard message: "+site.name,site:site.name,email:$("fe").value.trim(),phone:$("fp").value.trim(),message:m})})
 .then(function(r){if(!r.ok)throw 0;$("fm").value="";n.className="msg ok";n.textContent="Sent. Jack will get back to you."}).catch(function(){n.className="msg";n.textContent="That did not send. Try again."}).then(function(){b.disabled=false})}
function onMsg(e){var fr=$("fr");if(!fr||e.source!==fr.contentWindow||e.origin!==edOrigin)return;var d=e.data||{};
 if(d.type==="sh-edit")setVal(d.key,String(d.value==null?"":d.value));
 else if(d.type==="sh-photo"&&d.file)uploadFile(d.key,d.file,function(u){dirty[d.key]=u;fr.contentWindow.postMessage({type:"sh-set-image",key:d.key,url:u},edOrigin);updEd()})}
function setVal(k,v){var o=rows.filter(function(c){return c.key===k})[0];if(!o)return;if(v.trim()===String(o.value).trim())delete dirty[k];else dirty[k]=v.trim();updEd();upd()}
function updEd(){var b=$("pbtn");if(!b)return;var n=Object.keys(dirty).length;b.disabled=!n;b.textContent=n?"Publish "+n+" edit"+(n>1?"s":""):"Publish"}

/* ---------- shared: photos + publish ---------- */
function uploadFile(k,f,done){if(f.size>5e6){mode==="ed"?toast("Photo must be under 5 MB.","err"):alert("Photo must be under 5 MB.");return}
 var p=site.id+"/"+Date.now()+"-"+f.name.replace(/[^\w.-]/g,"_");
 sb.storage.from("site-images").upload(p,f).then(function(r){if(r.error){mode==="ed"?toast("Upload failed.","err"):alert("Upload failed.");return}
  done(sb.storage.from("site-images").getPublicUrl(p).data.publicUrl)})}
function publish(b){var ch=Object.keys(dirty).map(function(k){return{key:k,value:dirty[k]}});if(!ch.length)return;b.disabled=true;
 sb.rpc("publish_changes",{p_site:site.id,p_changes:ch}).then(function(r){
  b.disabled=false;
  if(r.error){return mode==="ed"?(toast(errText(r),"err"),updEd()):draw(errText(r))}
  rows.forEach(function(c){if(dirty[c.key]!=null)c.value=dirty[c.key]});dirty={};site.used=r.data.used;
  if(mode==="ed"){toast("Published. Your website is updated.","ok");updEd();panel()}else draw("Published. Your site is updated.",true)})}

/* ---------- admin tools ---------- */
function manage(){return'<div class="card"><div class="sec">Admin: manage this website</div>'+
 '<div class="f"><label>Plan</label><select id="mp"><option value="website"'+(site.plan==="website"?" selected":"")+'>$50/mo (1 change a month)</option><option value="monthly"'+(site.plan==="monthly"?" selected":"")+'>$250/mo (unlimited)</option></select> <button class="ghost" style="margin-top:8px" onclick="setPlan()">Save plan</button></div>'+
 '<div class="f"><label>Website address (https://...). This turns on click-to-edit.</label><input id="su" value="'+esc(site.url||"")+'" placeholder="https://theprogrambuilder.vercel.app" style="margin-bottom:8px"><button class="ghost" onclick="setUrl()">Save address</button></div>'+
 '<div class="f"><label>Give a client a login (they can edit this site only)</label><input id="ce" type="email" placeholder="client@email.com" style="margin-bottom:8px"><input id="cp" type="text" placeholder="Temporary password (8+ characters)" style="margin-bottom:8px"><button class="ghost" onclick="addClient()">Create login</button></div>'+
 '<div class="f"><label>Add editable fields, one per line: key | label | section | text, longtext or image | current value</label><textarea id="fl" style="min-height:120px" placeholder="home.headline | Headline | Home | text | Welcome to my site"></textarea><button class="ghost" style="margin-top:8px" onclick="addFields()">Add fields</button></div>'+
 '<div class="msg" id="mm"></div><div class="pill">Site code: <code>window.SHIFTABLE={site:"'+esc(site.slug)+'"}</code></div></div>'}
function note(t,g){var m=$("mm");m.className="msg"+(g?" ok":"");m.textContent=t}
function setPlan(){sb.from("sites").update({plan:mp.value}).eq("id",site.id).then(function(r){if(r.error)return note("Could not save.");site.plan=mp.value;site.lim=mp.value==="monthly"?null:1;note("Plan saved.",1)})}
function setUrl(){var v=su.value.trim().replace(/\/+$/,"");if(v&&!/^https:\/\//.test(v))return note("The address must start with https://");
 sb.from("sites").update({url:v||null}).eq("id",site.id).then(function(r){if(r.error)return note("Could not save. Run the latest SQL (schema.sql) in Supabase first.");site.url=v||null;note(v?"Saved. Reopen the site to see click-to-edit.":"Cleared.",1)})}
function addClient(){var e=ce.value.trim(),p=cp.value;if(!e||p.length<8)return note("Enter an email and a password of 8+ characters.");
 var tmp=supabase.createClient(URL_,KEY,{auth:{persistSession:false,autoRefreshToken:false,storageKey:"tmp"}});
 tmp.auth.signUp({email:e,password:p}).then(function(r){if(r.error&&!/registered/i.test(r.error.message))return note(r.error.message);
  sb.rpc("admin_add_member",{p_email:e,p_site:site.id}).then(function(x){if(x.error)return note(/no_such_user/.test(x.error.message)?"Login created, but it needs email confirmation first. Confirm it in Supabase > Authentication > Users, then press Create login again.":"Could not link.");
   note("Done. "+e+" can log in at getshiftable.com and edit this site.",1);ce.value=cp.value=""})})}
function addFields(){var out_=[],base=rows.length;fl.value.split("\n").forEach(function(l,i){if(!l.trim())return;var p=l.split("|").map(function(x){return x.trim()});
  if(!p[0])return;var k=["text","longtext","image"].indexOf(p[3])>-1?p[3]:"text";out_.push({site_id:site.id,key:p[0],label:p[1]||p[0],section:p[2]||"General",kind:k,value:p.slice(4).join("|").trim().replace(/\\n/g,"\n"),sort:base+i})});
 if(!out_.length)return note("Nothing to add.");
 sb.from("content").upsert(out_,{onConflict:"site_id,key"}).then(function(r){if(r.error)return note("Could not add fields.");open(site)})}

/* ---------- list editor (fallback and admin "Edit as list") ---------- */
function draw(msg,good){setMode("list");var secs={};rows.forEach(function(c){(secs[c.section]=secs[c.section]||[]).push(c)});
 var h='<div class="top"><div><h1>'+esc(site.name)+'</h1><div class="pill">Changes: '+left()+'</div></div><div>'+(isAdmin?'<button class="ghost" onclick="back()">All sites</button> ':'')+(site.url?'<button class="ghost" onclick="editor()">Visual editor</button> ':'')+'<button class="ghost" onclick="out()">Log out</button></div></div>';
 if(msg)h+='<div class="msg '+(good?"ok":"")+'">'+esc(msg)+'</div>';
 Object.keys(secs).forEach(function(k){h+='<div class="sec">'+esc(k)+'</div><div class="card">'+secs[k].map(field).join("")+'</div>'});
 if(isAdmin)h+=manage();
 app.innerHTML=h;
 app.querySelectorAll("[data-k]").forEach(function(el){el.oninput=function(){setVal(el.dataset.k,el.value)}});
 app.querySelectorAll("[data-f]").forEach(function(el){el.onchange=function(){var k=el.dataset.f;uploadFile(k,el.files[0],function(u){dirty[k]=u;var t=$("t_"+k);if(t)t.src=u;else draw();upd()})}});upd()}
function field(c){var v=dirty[c.key]!=null?dirty[c.key]:c.value,l='<label>'+esc(c.label||c.key)+'</label>';
 if(c.kind==="image")return'<div class="f">'+l+(v?'<img class="thumb" id="t_'+c.key+'" src="'+esc(v)+'">':'')+'<input type="file" accept="image/*" data-f="'+esc(c.key)+'"></div>';
 if(c.kind==="longtext")return'<div class="f">'+l+'<textarea data-k="'+esc(c.key)+'">'+esc(v)+'</textarea></div>';
 return'<div class="f">'+l+'<input data-k="'+esc(c.key)+'" value="'+esc(v)+'"></div>'}
function upd(){if(mode!=="list")return;var n=Object.keys(dirty).length;bar.style.display=n?"block":"none";$("barTxt").textContent=n+" edit"+(n>1?"s":"")+" ready. Publishing counts as one change."}
$("pub").onclick=function(){publish(this)};
boot();
</script></body></html>
