<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Program Builder — three designs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M16 3 29 16 16 29 3 16Z%27 fill=%27%23C0342B%27/%3E%3C/svg%3E">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{ --bar:52px; --ink:#0C1410; --line:rgba(255,255,255,.16); --red:#C0342B; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);font-family:'Barlow Condensed',system-ui,sans-serif;overflow:hidden}

#bar{height:var(--bar);display:flex;align-items:center;gap:1rem;padding:0 clamp(.7rem,2vw,1.2rem);
  background:#0C1410;border-bottom:1px solid var(--line);position:relative;z-index:5}
#bar .title{color:#fff;font-weight:700;font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;
  white-space:nowrap}
#bar .title b{color:var(--red)}
#tabs{display:flex;gap:.45rem;margin-left:auto}
.tab{display:flex;align-items:center;gap:.5rem;border:1px solid var(--line);background:transparent;
  color:#9FB0A4;font-family:inherit;font-weight:600;font-size:.74rem;letter-spacing:.13em;
  text-transform:uppercase;padding:.5rem .85rem;cursor:pointer;white-space:nowrap;
  transition:color .18s,border-color .18s,background .18s,transform .18s cubic-bezier(.2,.8,.3,1)}
.tab:hover{color:#fff;border-color:rgba(255,255,255,.4);transform:translateY(-2px)}
.tab.on{color:#fff;background:var(--red);border-color:var(--red)}
.tab kbd{font-family:inherit;font-size:.68rem;background:rgba(255,255,255,.14);border-radius:2px;
  padding:.06rem .34rem;line-height:1.5}
.tab.on kbd{background:rgba(0,0,0,.28)}
.hint{color:#6E8175;font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;white-space:nowrap}
@media(max-width:820px){ .hint{display:none} .tab .lbl{display:none} .tab{padding:.5rem .8rem} }

#stage{position:relative;height:calc(100% - var(--bar));background:var(--ink)}
iframe{width:100%;height:100%;border:0;display:block;background:var(--ink)}
#load{position:absolute;inset:0;display:grid;place-content:center;background:var(--ink);
  color:#6E8175;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;
  transition:opacity .35s;pointer-events:none}
#load.gone{opacity:0}
</style>
</head>
<body>

<div id="bar">
  <div class="title">The Program <b>Builder</b> — three designs</div>
  <span class="hint">Press 1, 2 or 3</span>
  <div id="tabs">
    <button class="tab on" data-v="1"><kbd>1</kbd><span class="lbl">Traced field</span></button>
    <button class="tab"    data-v="2"><kbd>2</kbd><span class="lbl">Red white blue</span></button>
    <button class="tab"    data-v="3"><kbd>3</kbd><span class="lbl">Chalk &amp; grass</span></button>
  </div>
</div>

<div id="stage">
  <iframe id="frame" title="Design preview"></iframe>
  <div id="load">Loading</div>
</div>

<script>
var PATHS={'1':'v1/','2':'v2/','3':'v3/'};
var frame=document.getElementById('frame');
var load=document.getElementById('load');
var current=null;

function show(v,push){
  if(!PATHS[v] || v===current) return;
  current=v;
  load.classList.remove('gone');
  frame.src=PATHS[v];
  document.querySelectorAll('.tab').forEach(function(t){
    t.classList.toggle('on', t.dataset.v===v);
  });
  if(push!==false && location.hash!=='#'+v) history.replaceState(null,'','#'+v);
}

frame.addEventListener('load',function(){ load.classList.add('gone'); });

document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){ show(t.dataset.v); });
});

/* keys pressed on the shell */
addEventListener('keydown',function(e){
  if(e.key==='1'||e.key==='2'||e.key==='3') show(e.key);
});
/* keys pressed inside the iframe, forwarded by each design */
addEventListener('message',function(e){
  if(e.data && e.data.tpb==='switch') show(e.data.v);
});

addEventListener('hashchange',function(){ show((location.hash||'#1').slice(1),false); });
show((location.hash||'#1').slice(1));
</script>
</body>
</html>
