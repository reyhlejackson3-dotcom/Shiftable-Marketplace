<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shiftable · Your site</title><link rel="icon" href="../assets/img/favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#03040A;--card:#0d1018;--line:#1c2130;--tx:#eef1f7;--mut:#8a93a8;--mint:#7CFFC0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 90px}
h1{font-size:22px;margin:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 5px}
input,textarea,select{width:100%;background:#070910;color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit}
textarea{min-height:90px;resize:vertical}input:focus,textarea:focus{outline:1px solid var(--mint)}
button{background:var(--mint);color:#03130b;border:0;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;font:inherit;font-weight:600}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}button:disabled{opacity:.4;cursor:default}
.f{margin-bottom:16px}.sec{color:var(--mint);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:22px 0 10px}
.pill{font-size:12px;color:var(--mut)}.msg{margin:10px 0;color:#ffb4b4;font-size:13px}.ok{color:var(--mint)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#070910ee;border-top:1px solid var(--line);padding:12px 16px;display:none}
.bar>div{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.thumb{width:100%;max-height:160px;object-fit:cover;border-radius:9px;margin-bottom:8px;background:#070910}
</style></head><body><div class="wrap" id="app"></div>
<div class="bar" id="bar"><div><span class="pill" id="barTxt"></span><button id="pub">Publish changes</button></div></div>
<script>
var URL_="https://obuudbrlurybwcvuungr.supabase.co", KEY="sb_publishable_uyqV26xV1aLF_HjhIdCYcA_fUgo0KkY";
var app=document.getElementById("app"), bar=document.getElementById("bar");
if(!URL_){app.innerHTML='<div class="card">Dashboard not connected yet. Add the Supabase URL and key at the top of this file.</div>';throw 0}
var sb=supabase.createClient(URL_,KEY), site=null, rows=[], dirty={};
var ERR={monthly_limit_reached:"You have used this month's change. It resets on the 1st, or upgrade for unlimited.",nothing_changed:"Nothing was different, so no change was used.",not_allowed:"You do not have access to this site."};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function login(msg){bar.style.display="none";app.innerHTML='<div class="card" style="max-width:380px;margin:12vh auto"><h1>Log in</h1><p class="pill">Edit your website text and photos.</p><div class="f"><label>Email</label><input id="em" type="email" autocomplete="username"></div><div class="f"><label>Password</label><input id="pw" type="password" autocomplete="current-password"></div><button id="go" style="width:100%">Log in</button><div class="msg">'+esc(msg||"")+'</div></div>';
 var go=function(){sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value}).then(function(r){r.error?login("Wrong email or password."):boot()})};
 document.getElementById("go").onclick=go;pw.onkeydown=function(e){if(e.key==="Enter")go()}}
function boot(){sb.auth.getSession().then(function(r){if(!r.data.session)return login();
 sb.rpc("my_sites").then(function(s){var l=s.data||[];if(!l.length){app.innerHTML='<div class="card">No site is linked to this login yet. Email Jack.</div>';return}
  if(l.length===1)return open(l[0]);
  app.innerHTML='<div class="top"><h1>Your sites</h1><button class="ghost" onclick="out()">Log out</button></div>'+l.map(function(x,i){return'<div class="card"><b>'+esc(x.name)+'</b> <span class="pill">'+x.slug+'</span> <button style="float:right" onclick="pick('+i+')">Edit</button></div>'}).join("");window._l=l})})}
function pick(i){open(window._l[i])}
function out(){sb.auth.signOut().then(function(){login()})}
function open(s){site=s;dirty={};sb.from("content").select("*").eq("site_id",s.id).order("sort").then(function(r){rows=r.data||[];draw()})}
function left(){return site.lim==null?"Unlimited":Math.max(0,site.lim-site.used)+" of "+site.lim+" left this month"}
function draw(msg,good){var secs={};rows.forEach(function(c){(secs[c.section]=secs[c.section]||[]).push(c)});
 var h='<div class="top"><div><h1>'+esc(site.name)+'</h1><div class="pill">Changes: '+left()+'</div></div><button class="ghost" onclick="out()">Log out</button></div>';
 if(msg)h+='<div class="msg '+(good?"ok":"")+'">'+esc(msg)+'</div>';
 Object.keys(secs).forEach(function(k){h+='<div class="sec">'+esc(k)+'</div><div class="card">'+secs[k].map(field).join("")+'</div>'});
 app.innerHTML=h;
 app.querySelectorAll("[data-k]").forEach(function(el){el.oninput=function(){set(el.dataset.k,el.value)}});
 app.querySelectorAll("[data-f]").forEach(function(el){el.onchange=function(){upload(el.dataset.f,el.files[0])}});upd()}
function field(c){var v=dirty[c.key]!=null?dirty[c.key]:c.value,l='<label>'+esc(c.label||c.key)+'</label>';
 if(c.kind==="image")return'<div class="f">'+l+(v?'<img class="thumb" id="t_'+c.key+'" src="'+esc(v)+'">':'')+'<input type="file" accept="image/*" data-f="'+esc(c.key)+'"></div>';
 if(c.kind==="longtext")return'<div class="f">'+l+'<textarea data-k="'+esc(c.key)+'">'+esc(v)+'</textarea></div>';
 return'<div class="f">'+l+'<input data-k="'+esc(c.key)+'" value="'+esc(v)+'"></div>'}
function set(k,v){var o=rows.filter(function(c){return c.key===k})[0];if(v===o.value)delete dirty[k];else dirty[k]=v;upd()}
function upd(){var n=Object.keys(dirty).length;bar.style.display=n?"block":"none";document.getElementById("barTxt").textContent=n+" edit"+(n>1?"s":"")+" ready. Publishing counts as one change."}
function upload(k,f){if(!f)return;if(f.size>5e6)return alert("Photo must be under 5 MB.");
 var p=site.id+"/"+Date.now()+"-"+f.name.replace(/[^\w.-]/g,"_");
 sb.storage.from("site-images").upload(p,f).then(function(r){if(r.error)return alert("Upload failed.");
  var u=sb.storage.from("site-images").getPublicUrl(p).data.publicUrl;dirty[k]=u;var t=document.getElementById("t_"+k);if(t)t.src=u;else draw();upd()})}
document.getElementById("pub").onclick=function(){var b=this;b.disabled=true;
 var ch=Object.keys(dirty).map(function(k){return{key:k,value:dirty[k]}});
 sb.rpc("publish_changes",{p_site:site.id,p_changes:ch}).then(function(r){b.disabled=false;
  if(r.error){var m=(r.error.message||"").replace(/^.*?(monthly_limit_reached|nothing_changed|not_allowed).*$/,"$1");return draw(ERR[m]||"Could not publish. Try again.")}
  rows.forEach(function(c){if(dirty[c.key]!=null)c.value=dirty[c.key]});dirty={};site.used=r.data.used;draw("Published. Your site is updated.",true)})};
boot();
</script></body></html>
